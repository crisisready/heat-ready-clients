[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatready"
version = "0.1.0"
description = "Python client for the HeatReady heat-risk API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CrisisReady" }]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=7.4", "responses>=0.24"]

[project.urls]
Homepage = "https://github.com/crisisready/heat-ready-clients"
"API reference" = "https://nishantkishore.com/workshop/api"

[tool.setuptools.packages.find]
where = ["src"]
